[project]
name = "agent-observatory"
version = "0.1.0"
description = "Local, privacy-first quality-drift analyzer for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
observatory = "observatory.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
# Offline suite is the default; live tests touch real local logs and must be opted in.
addopts = "-m 'not live'"
markers = [
    "live: tests that read real local agent logs (opt-in, never run in CI)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented pattern is to call Option()/Argument() in parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["observatory"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb"]
ignore_missing_imports = true
